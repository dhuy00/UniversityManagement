# postgresql.wal.conf
#
# WAL archiving configuration snippet.  Apply by mounting this file at
# /etc/postgresql/postgresql.conf.d/wal.conf or by concatenating it into the
# postgresql.conf that the postgres container uses at startup.
#
# Notes:
# - archive_mode is a runtime parameter that requires a server restart.
# - archive_command is a per-segment command.  The example uses
#   pgbackrest-style archive but the simplest reliable target is a local
#   directory mounted into the container.
# - The script path expects a shell script mounted at
#   /var/lib/postgresql/wal-archive.sh.  See wal-archive.sh alongside
#   this file.

# ---- WAL archiving -----------------------------------------------------
wal_level = replica
archive_mode = on
archive_command = 'bash /var/lib/postgresql/wal-archive.sh %p %f'
archive_timeout = 60

# ---- Performance / durability trade-offs --------------------------------
# Use a high enough max_wal_size to avoid frequent forced checkpoints.
max_wal_size = 1GB
min_wal_size = 80MB

# fsync and synchronous_commit stay ON by default; this is the recovery
# target.  PITR requires synchronous_commit = on (or at least a history
# of flushed WAL segments that can be replayed).

# ---- Slots (optional) ---------------------------------------------------
# Replication slots guarantee WAL is retained until every consumer has
# fetched it.  Only create slots when you have a real consumer; an
# abandoned slot will eventually fill the disk.
#
# SELECT * FROM pg_create_physical_replication_slot('pitr_slot');
# primary_slot_name = 'pitr_slot'

# ---- Monitoring queries -------------------------------------------------
# See whether the archiver is keeping up:
#   SELECT archived_count, failed_count, last_archived_time,
#          last_archived_wal, active
--   FROM pg_stat_archiver;
#
# Find the current WAL position:
#   SELECT pg_current_wal_lsn();

# ---- Tooling versions ----------------------------------------------------
# target /  postgres: 16-alpine
# side-car archive:    rsync + bash, or minio/azure-cli for object storage
